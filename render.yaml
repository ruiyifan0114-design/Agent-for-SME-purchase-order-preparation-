services:
  - type: web
    name: supplydesk-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: SUPABASE_URL
        value: https://ucxldptibvbcytlqtabw.supabase.co
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: ALLOW_API_KEYS
        value: false
      - key: CORS_ORIGINS
        value: '["https://ruiyifan0114-design.github.io"]'
