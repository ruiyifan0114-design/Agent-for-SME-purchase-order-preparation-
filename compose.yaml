services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procurement}
      POSTGRES_DB: procurement
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - procurement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://procurement:${POSTGRES_PASSWORD:-procurement}@db:5432/procurement
      API_KEY: ${API_KEY:-local-service-change-me}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:-local-reviewer-change-me}
      REVIEWER_NAME: ${REVIEWER_NAME:-Demo Human Reviewer}
      FINANCE_API_KEY: ${FINANCE_API_KEY:-local-finance-change-me}
      FINANCE_REVIEWER_NAME: ${FINANCE_REVIEWER_NAME:-Demo Finance Manager}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_AUDIENCE: ${SUPABASE_AUDIENCE:-authenticated}
      ALLOW_API_KEYS: ${ALLOW_API_KEYS:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  procurement_data:
